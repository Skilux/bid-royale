name: deploy

on:
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read

env:
  VERCEL_ORG_ID: team_LQxNmEwVHqkFceuz22qysTZz
  VERCEL_PROJECT_ID: prj_2UNSoPkbOhuNbcjVNH2df88iDOm0

jobs:
  deploy:
    name: vercel production
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Vercel CLI
        run: npm i -g vercel

      - name: Deploy
        run: |
          rm -rf .git
          vercel deploy --prod --yes --token "$VERCEL_TOKEN"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

      - name: Health check
        run: |
          for i in 1 2 3 4 5 6; do
            if curl -fsS -m 15 https://ad-slot-auction.vercel.app/api/health | grep -q '"ok":true'; then
              echo "health ok"
              exit 0
            fi
            sleep 10
          done
          echo "health check failed"
          exit 1
