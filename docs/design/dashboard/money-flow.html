<head>

<title>Dashboard concept 3 · Money flow · Bid Royale</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800&family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --night:#0b0908; --night-2:#151110; --panel:rgba(18,13,12,.74); --panel-solid:#151110;
  --cream:#eee6d8; --muted:rgba(238,230,216,.66); --faint:rgba(238,230,216,.38); --ghost:rgba(238,230,216,.14);
  --line:rgba(242,228,201,.13); --line-strong:rgba(242,228,201,.28);
  --blood:#cf352e; --ember:#ed4b43; --wine:#24100f; --amber:#e7a84b; --dawn:#ffd9a0; --verified:#72c99a;
  --ease:cubic-bezier(.22,1,.36,1); --ease-stamp:cubic-bezier(.3,1.6,.5,1);
  --d-fast:180ms; --d-base:420ms; --d-slow:900ms;
  --f-display:"Barlow Condensed","Arial Narrow",sans-serif;
  --f-serif:"Instrument Serif",Georgia,"Times New Roman",serif;
  --f-mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;background:#050404;color:var(--cream);font:13px/1.45 var(--f-mono);-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer}
a{color:inherit}
.num{font-variant-numeric:tabular-nums}
#box{position:relative;margin:0 auto;overflow:hidden}
#stage{position:absolute;left:0;top:0;width:1280px;height:800px;transform-origin:0 0;overflow:hidden;isolation:isolate;background:var(--night)}

/* badges: one vocabulary, three states */
.bdg{display:inline-flex;align-items:center;gap:4px;font:600 9px/1 var(--f-mono);letter-spacing:.1em;padding:3px 6px;border-radius:999px;border:1px solid;white-space:nowrap;vertical-align:middle}
.bdg.real{color:var(--verified);border-color:var(--verified)}
.bdg.real::before{content:"";width:5px;height:5px;border-radius:50%;background:currentColor}
.bdg.sim{color:var(--amber);border:1px dashed var(--amber)}
.bdg.pre{color:var(--cream);border-color:var(--cream)}
.bdg.pre::before{content:"";width:5px;height:5px;background:currentColor}
.tx{font:500 10px var(--f-mono);color:var(--verified);text-decoration:none;border-bottom:1px dotted rgba(114,201,154,.6);white-space:nowrap;margin-left:4px}
.tx:hover{color:var(--cream)}

/* verdict chips: four, nothing else */
.vc{display:inline-block;font:700 12px/1 var(--f-display);letter-spacing:.12em;text-transform:uppercase;padding:5px 9px;border-radius:5px;border:1px solid;opacity:0;transform:scale(.7);transition:opacity var(--d-base) var(--ease),transform 520ms var(--ease-stamp)}
.vc.on{opacity:1;transform:none}
.vc.pass{color:var(--verified);border-color:var(--verified);background:rgba(114,201,154,.1)}
.vc.short{color:var(--amber);border-color:var(--amber);background:rgba(231,168,75,.1)}
.vc.under{color:#fff;border-color:var(--ember);background:var(--ember);box-shadow:0 0 22px rgba(237,75,67,.55)}
.vc.lost{color:var(--faint);border-color:var(--line-strong);background:transparent}

.label{font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--faint)}
.chip{font-size:10px;letter-spacing:.06em;padding:3px 8px;border:1px solid var(--line-strong);border-radius:999px;color:var(--faint);transition:all var(--d-base) var(--ease);white-space:nowrap}
.chip.on{color:var(--dawn);border-color:rgba(255,217,160,.55);background:rgba(255,217,160,.06)}
.chip.red.on{color:var(--ember);border-color:rgba(237,75,67,.6);background:rgba(237,75,67,.08)}

/* prototype controls, not part of the design */
#ctl{position:absolute;left:0;right:0;bottom:0;display:flex;align-items:center;gap:10px;height:44px;padding:0 14px;background:#0e0b0a;border-top:1px solid var(--line);font-size:11px;color:var(--muted);z-index:5}
#ctl button{border:1px solid var(--line-strong);background:rgba(238,230,216,.04);padding:5px 12px;border-radius:999px;font-size:11px;letter-spacing:.08em;text-transform:uppercase}
#ctl button:hover{border-color:var(--cream)}
#ctl .scrub{position:relative;flex:1;height:18px;cursor:pointer}
#ctl .scrub::before{content:"";position:absolute;left:0;right:0;top:8px;height:3px;background:var(--ghost);border-radius:2px}
#ctl .scrub i{position:absolute;left:0;top:8px;height:3px;background:linear-gradient(90deg,var(--blood),var(--amber),var(--dawn));border-radius:2px}
#ctl .scrub b{position:absolute;top:3px;width:1px;height:13px;background:var(--line-strong)}
#ctl .scrub b span{position:absolute;top:-2px;left:3px;font:400 8px var(--f-mono);letter-spacing:.1em;color:var(--faint);text-transform:uppercase;white-space:nowrap;display:none}
#ctl time{min-width:44px;text-align:right;font-variant-numeric:tabular-nums}
#ctl .tog{display:flex;align-items:center;gap:6px;white-space:nowrap}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* concept 3: money flow. NeoRack on the left, escrow in the middle, suppliers on the right. Coins travel the rails. */
#stage{background:radial-gradient(70% 55% at 50% 0%,rgba(207,53,46,.2),transparent 70%),linear-gradient(#0b0908,#100a09)}
.top{height:46px;display:flex;align-items:center;gap:18px;padding:0 24px;border-bottom:1px solid var(--line)}
.brand b{font:800 22px/1 var(--f-display);letter-spacing:.04em;text-transform:uppercase}
.brand em{font:italic 22px/1 var(--f-serif);color:var(--ember);margin-left:6px}
.sp{flex:1}.clock{font:600 12px var(--f-mono);color:var(--muted);min-width:44px;text-align:right}
.steps{display:flex;gap:0;height:26px;padding:0 24px;align-items:center;font:600 10px var(--f-mono);letter-spacing:.16em;text-transform:uppercase;color:var(--faint)}
.stp{flex:1;display:flex;align-items:center;gap:8px}
.stp::after{content:"";flex:1;height:1px;background:var(--line-strong);margin-right:8px}
.stp:last-child::after{display:none}
.stp i{width:9px;height:9px;border-radius:50%;border:1px solid var(--line-strong);transition:all var(--d-base) var(--ease)}
.stp.done{color:var(--muted)}.stp.done i{background:var(--ember);border-color:var(--ember)}
.stp.on{color:var(--dawn)}.stp.on i{background:var(--dawn);border-color:var(--dawn);box-shadow:0 0 0 4px rgba(255,217,160,.16),0 0 12px var(--amber)}
.node{position:absolute;border:1px solid var(--line);border-radius:14px;background:rgba(18,13,12,.82);padding:12px 14px;transition:border-color var(--d-slow),box-shadow var(--d-slow),opacity var(--d-slow),filter var(--d-slow)}
.node h3{margin:0;font:800 22px/1 var(--f-display);letter-spacing:.03em;text-transform:uppercase}
.node .per{font-size:10px;color:var(--faint);margin-top:2px}
#svg{position:absolute;left:0;top:0;width:1280px;height:800px;pointer-events:none}
.rail{fill:none;stroke:rgba(238,230,216,.16);stroke-width:1.5;stroke-dasharray:3 5;transition:stroke 600ms var(--ease)}
.rail.amb{stroke:var(--amber);stroke-dasharray:none;opacity:.55}
.rail.grn{stroke:var(--verified);stroke-dasharray:none;opacity:.6}
.rail.red{stroke:var(--ember);stroke-dasharray:none;opacity:.9;stroke-width:2.5}
#coins{position:absolute;inset:0;pointer-events:none;z-index:6}
.coin{position:absolute;left:0;top:0;display:flex;align-items:center;gap:4px;padding:2px 7px;border-radius:999px;font:700 12px var(--f-mono);white-space:nowrap;transform:translate(-50%,-50%);box-shadow:0 0 14px currentColor}
.coin.sm{width:12px;height:12px;padding:0;font-size:0}.coin.amb{background:var(--amber);color:#2b1a00}.coin.grn{background:var(--verified);color:#06241a}.coin.red{background:var(--ember);color:#fff;font-size:16px;padding:4px 11px}
.label{font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--faint)}
.quote{font:italic 19px/1.15 var(--f-serif);margin:6px 0 8px}
.terms{display:flex;gap:4px;flex-wrap:wrap}.terms .chip{padding:2px 6px;font-size:9.5px}.terms .chip b{color:var(--cream)}
.big{font:700 52px/1 var(--f-display);margin-top:4px}.big small{font:500 12px var(--f-mono);color:var(--muted);margin-left:6px}
.ln{display:flex;justify-content:space-between;align-items:center;font-size:11px;color:var(--muted);padding:3px 0;border-top:1px solid var(--line);gap:6px}
.ln b{color:var(--cream);font-weight:600}.ln.back b{color:var(--ember)}
.bar{display:flex;height:12px;border-radius:999px;background:var(--ghost);overflow:hidden;margin:6px 0 4px}
.seg{height:100%;width:0;transition:width 600ms var(--ease);border-right:2px solid var(--night)}
.seg.r1{background:var(--ember)}.seg.r2{background:#e8743f}.seg.r3{background:var(--amber)}
.node.glow{border-color:rgba(237,75,67,.8);box-shadow:0 0 0 1px rgba(237,75,67,.3),0 0 44px rgba(237,75,67,.35)}
.er{position:absolute;left:12px;right:12px;height:112px;border-top:1px solid var(--line);padding-top:6px}
.er:first-of-type{border-top:0}
.er .nm{font:700 15px var(--f-display);letter-spacing:.06em;text-transform:uppercase}
.er .cell{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:2px 4px;font-size:10.5px;margin-top:5px;padding:3px 7px;border:1px dashed var(--line-strong);border-radius:6px;color:var(--faint);white-space:nowrap}
.er .cell.on{border:1px solid rgba(231,168,75,.5);background:rgba(231,168,75,.06);color:var(--muted)}
.er .cell.out{border-color:rgba(114,201,154,.45);background:rgba(114,201,154,.05)}
.er .cell.red{border-color:rgba(237,75,67,.6);background:rgba(237,75,67,.08)}
.er .cell b{color:var(--amber);font:700 14px var(--f-display);margin:0 4px}
.er.dead{opacity:.45}
.sup .bid{font-size:10px;color:var(--muted);margin:2px 0 0;min-height:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.sup .bid b{color:var(--cream)}
.sup{padding:8px 12px!important}.sup .hd{display:flex;justify-content:space-between;align-items:center;min-height:26px}.sup h3{font-size:20px}.sup .per{display:none}
.sup{display:flex;gap:10px}.sup .sb{flex:1;min-width:0}
.cr{position:relative;flex:0 0 58px;height:94px;border-radius:7px;overflow:hidden;display:flex;flex-direction:column;justify-content:flex-end;padding:6px;border:1px solid var(--line-strong)}
.cr i{position:absolute;inset:0;z-index:0}
.cr b,.cr span,.cr u{position:relative;z-index:1;display:block}
.cr b{font:800 11px/1 var(--f-display);letter-spacing:.06em;text-transform:uppercase;color:#fff}
.cr span{font:700 9px/1.1 var(--f-display);color:rgba(255,255,255,.85);margin:2px 0 4px;text-transform:uppercase}
.cr u{font:600 7px var(--f-mono);text-decoration:none;text-align:center;padding:2px 0;border-radius:2px;background:#fff;color:#111}
.cr-techblog i{background:linear-gradient(160deg,#0f2a3a,#1e5f74 60%,#72c99a)}
.cr-codepodcast i{background:repeating-linear-gradient(90deg,#4b2a6b 0 4px,#7a3fa0 4px 6px),#4b2a6b}
.cr-devnewsletter i{background:linear-gradient(180deg,#f4efe4 0 38%,#c9362e 38%)}
.cr-devnewsletter b{color:#111}.cr-devnewsletter span{color:#fff}
.cr-gamingforum i{background:radial-gradient(80% 60% at 50% 30%,#ff3df0,#2a0a4a 70%)}
.sup .vcw{min-height:24px}
.sup.lost .cr{filter:grayscale(1)}
.gwrap{position:relative;margin-top:15px}
.gauge{position:relative;height:11px;border-radius:4px;background:var(--ghost)}
.gauge i{position:absolute;left:0;top:0;bottom:0;border-radius:4px 0 0 4px;background:var(--verified);width:0}
.gauge u{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--ember);text-decoration:none}
.gauge u span{position:absolute;top:15px;left:-12px;font:500 8px var(--f-mono);color:var(--ember);white-space:nowrap}
.gauge u+u{background:var(--dawn)}.gauge u+u span{top:-12px;left:-18px;color:var(--dawn)}
.sup .row2{display:flex;align-items:baseline;gap:8px;margin-top:9px}
.sup .row2 b{font:700 24px/1 var(--f-display)}.sup .row2 span{font-size:10px;color:var(--muted)}
.sup.lost{opacity:.5;filter:saturate(.3)}
.sup.under{border-color:rgba(237,75,67,.7);box-shadow:0 0 28px rgba(237,75,67,.25)}.sup.pass{border-color:rgba(114,201,154,.5)}.sup.short{border-color:rgba(231,168,75,.5)}
.pn{position:absolute;top:602px;height:186px;border:1px solid var(--line);border-radius:12px;background:rgba(18,13,12,.8);padding:10px 12px;overflow:hidden}
.bot{display:grid;grid-template-columns:1fr auto;gap:0 8px;font-size:10.5px;padding:4px 0;border-top:1px solid var(--line)}
.bot b{font-weight:600}.bot span{color:var(--muted);text-align:right}.bot .warn{color:var(--amber);grid-column:1/3;text-align:left;font-size:10px}.bot .dim{color:var(--faint)}
.pn ul{list-style:none;margin:6px 0 0;padding:0}
.pn li{display:flex;gap:8px;align-items:center;padding:3px 0;border-top:1px solid var(--line);font-size:10.5px;color:var(--muted);white-space:nowrap;overflow:hidden}
.pn li em{font-style:normal;font-size:9px;letter-spacing:.08em;color:var(--faint);min-width:128px}
.pn li span{flex:1;overflow:hidden;text-overflow:ellipsis}
.pn li.new{color:var(--cream)}.pn li.new em{color:var(--dawn)}
.chips{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px}
.rc{margin-top:6px}.rc .n{font:800 30px/1 var(--f-display);color:var(--dawn)}.rc .n small{font:500 12px var(--f-mono);color:var(--muted)}
.rc .t{font-size:10.5px;color:var(--muted);margin-top:3px;line-height:1.5}.rc .t b{color:var(--cream)}
.rc.off{opacity:.25}
.flash{position:absolute;inset:0;z-index:5;pointer-events:none;opacity:0;background:radial-gradient(100% 80% at 40% 40%,rgba(237,75,67,0) 30%,rgba(237,75,67,.35));transition:opacity 500ms var(--ease)}
#stage.hero .flash{opacity:1}
.refund{position:absolute;left:272px;top:352px;width:150px;z-index:7;pointer-events:none;text-align:center;font:800 26px/1 var(--f-display);letter-spacing:.08em;text-transform:uppercase;color:#fff;background:var(--ember);padding:8px 6px;border-radius:8px;opacity:0;transform:scale(.6) rotate(-4deg);transition:all 500ms var(--ease-stamp);box-shadow:0 0 30px rgba(237,75,67,.6)}
.refund small{display:block;font:600 9px var(--f-mono);letter-spacing:.12em;margin-top:3px}
#stage.hero .refund{opacity:1;transform:scale(1) rotate(-4deg)}
#wn.pulse{display:inline-block;animation:pop 900ms var(--ease-stamp) 2}
@keyframes pop{50%{transform:scale(1.18);color:var(--ember)}}
</style>
